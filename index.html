<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS-JavaScript</title>
</head>
<body style="background-color:slategray;">
    <div id="loc_href" style="color:wheat;">Location href: </div>
    <script>
        document.getElementById("loc_href").innerHTML += window.location.href;
    </script>
    <form name="n_selectForm">
        <label for="musicTypes">Choose some music types, then click the button below:</label>
        <div>
            <select id="musicTypes_id" name="n_musicTypes" multiple>
                <option>R&B</option>
                <option>Jazz</option>
                <option>Blues</option>
                <option>New Age</option>
                <option>Classical</option>
                <option>Opera</option> 
            </select>
        </div>
        <button id="btn" type="button">How many are selected?</button>
    </form>
    <script defer src="./scripts.js"></script>
</body>
</html>
