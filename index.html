<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS-JavaScript</title>
    <script>
        document.addEventListener("DOMContentLoaded", function(){
            let el = document.getElementById("msg");
            el.style.color = "red";
        });
    </script>
</head>
<body>
    <p id="msg">Hello World</p>
</body>
</html>
