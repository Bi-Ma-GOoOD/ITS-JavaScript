<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS-JavaScript</title>
</head>
<body>
    <h1>
        Test
    </h1>
</body>
<script>
    // ระบบคำนวณและแสดงใบเสร็จสำหรับร้านกาแฟ
    const STORE_NAME = "Coffee Corner"; // ชื่อร้านกาแฟ
    const PRICE_PER_CUP = 45; // ราคาแก้วกาแฟ 1 แก้ว
    const CUPS_PER_ORDER = 3; // จำนวนแก้วกาแฟที่สั่งใน 1 รอบการสั่ง (Order)
    let totalPrice = PRICE_PER_CUP * CUPS_PER_ORDER; // ราคารวม
    const DISCOUNT_RATE = 0.1; // ส่วนลด

    if (CUPS_PER_ORDER >= 3) {
        totalPrice = totalPrice - (totalPrice * DISCOUNT_RATE); // ราคารวมหลังจากใช้ส่วนลด เมื่อลูกค้าสั่งกาแฟไม่น้อยกว่า 3 แก้ว
    }

    const RECEIPT = STORE_NAME + ": " + totalPrice + " baht"; // Pattern การแสดงใบเสร็จ
    console.log(RECEIPT); // แสดงใบเสร็จ และ ราคากาแฟรวมก่อนคิดภาษี (VAT)

    const TAX_RATE = 0.07; // ค่าภาษี (VAT)
    let finalPrice = totalPrice;
    finalPrice = finalPrice + (finalPrice * TAX_RATE); // ราคาค่ากาแฟ หลังจากรวมค่าภาษีแล้ว

    console.log(finalPrice); // แสดงราคาหลังรวม VAT แล้ว
</script>
</html>
