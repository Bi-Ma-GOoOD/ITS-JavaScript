<script>
    let total = 0;
    let itemPrice = 250;
    let quantity = 3;
    let discount = 50;
    let taxRate = 0.07; // 7%

    total += (itemPrice * quantity); // total = 0 + (250 * 3) => 750
    total -= discount; // total = 750 - 50 = 700
    let tax = total * taxRate; // tax = 700 * 0.07 =49
    total += tax; // total = 700 + 49 = 749

    console.log(total);
</script>
