<!DOCTYPE html>
<html lang="en">

<body>
    <h1>
        Test
    </h1>
</body>
<script>
    let p = 7;
    let q = 2;

    console.log(p % q);        // 1
    console.log(Math.floor(p / q));  // 3

    let y = 10;
    console.log(++y);          // 11
    console.log(y);            // 11
    console.log(y--);          // 11
    console.log(y);            // 10

    let label = "Total: " + (3 + 4) + 2;
    console.log(label);        // "Total: 72"
</script>
</html>
